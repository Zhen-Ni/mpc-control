[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpc-control"
version = "0.1.0"
description = "A Python library for Model Predictive Control (MPC)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zhen Ni", email = "z.ni@hotmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "osqp>=1.0.0",
    "scipy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Zhen-Ni/mpc-control"
Issues = "https://github.com/Zhen-Ni/mpc-control/issues"

[tool.setuptools.packages.find]
include = ["mpc*"]
exclude = ["test*", "examples*"]
